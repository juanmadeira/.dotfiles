env=EDITOR,nvim

env=LIBVA_DRIVER_NAME,nvidia
env=__GLX_VENDOR_LIBRARY_NAME,nvidia

env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_FORCE_DPI,125
env=QT_QPA_PLATFORMTHEME,qt5ct

exec_once=echo "Xft.dpi: 125" | xrdb -merge
exec_once=gsettings set org.gnome.desktop.interface text-scaling-factor 1.25

exec_once=gsettings set org.gnome.desktop.interface gtk-theme "Juno"
exec_once=gsettings set org.gnome.desktop.wm.preferences theme "Juno"
exec_once=gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

exec_once=wbg -s $HOME/.dotfiles/wallpapers/araruama-2d5a27.jpg
exec_once=clipse -listen
exec_once=mpdscribble
